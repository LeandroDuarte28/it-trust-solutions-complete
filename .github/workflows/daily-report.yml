name: Relatório Diário de Status (08:00)

on:
  schedule:
    # 08:00 Horário de Brasília (UTC-3) = 11:00 UTC
    - cron: '0 11 * * *'
  workflow_dispatch: # Permite disparar manualmente pelo painel do GitHub a qualquer momento

jobs:
  send-daily-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Executar envio do relatório diário
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          node send_report_now.js
